<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장비 예약 캘린더</title>
  <style>
    :root { --navy:#10233f; --blue:#2169e8; --sky:#eef5ff; --line:#dce5f1; --muted:#69768a; --danger:#d73a4a; }
    * { box-sizing:border-box; } body { margin:0; background:#f5f8fc; color:#152033; font-family:"Pretendard","Noto Sans KR",Arial,sans-serif; }
    header { background:var(--navy); color:#fff; padding:28px clamp(20px,5vw,70px); display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:24px; margin:0; letter-spacing:-.7px; } .subtitle { margin:7px 0 0; opacity:.72; font-size:14px; }
    .wrap { max-width:1320px; margin:30px auto; padding:0 22px; display:grid; grid-template-columns:300px 1fr; gap:24px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 18px #1c37630a; }
    .side-head, .calendar-head { padding:20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    h2 { margin:0; font-size:17px; } button { border:0; cursor:pointer; font:inherit; } .primary { background:var(--blue); color:#fff; border-radius:8px; padding:10px 14px; font-weight:700; } .primary:hover { background:#1456c7; }
    .equip-list { padding:12px; min-height:180px; }.equip { width:100%; text-align:left; background:#fff; border:1px solid transparent; border-radius:10px; padding:13px 12px; display:flex; align-items:center; gap:10px; margin-bottom:5px; }
    .equip:hover { background:#f4f7fb; }.equip.active { background:var(--sky); border-color:#bed7ff; color:#1252bb; }.equip .icon { width:34px; height:34px; background:#e8eef8; border-radius:9px; display:grid; place-items:center; font-size:18px; }.equip.active .icon { background:#d7e8ff; }.equip-name { flex:1; font-weight:700; }.edit { color:#77849a; background:transparent; font-size:17px; padding:4px; }
    .side-note { padding:17px 20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.6; }.calendar-head { min-height:76px; }.month-nav { display:flex; align-items:center; gap:12px; }.month-nav button { background:#f1f5fb; color:#24344d; width:34px; height:34px; border-radius:8px; font-size:20px; }.month-title { font-size:20px; font-weight:800; min-width:125px; text-align:center; }
    .selected-label { background:#edf4ff; color:#245daf; border-radius:99px; font-weight:700; font-size:13px; padding:8px 12px; }.weekdays,.days { display:grid; grid-template-columns:repeat(7,1fr); }.weekdays div { padding:13px 10px; color:#8490a2; font-size:12px; font-weight:700; border-bottom:1px solid var(--line); }.weekdays div:first-child { color:#d44e5d; }.days { min-height:620px; }.day { border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:116px; padding:8px; overflow:hidden; }.day:nth-child(7n) { border-right:0; }.day.other { background:#fafbfd; }.date { font-size:13px; font-weight:700; color:#516076; display:inline-grid; place-items:center; width:25px; height:25px; }.date.sun { color:#d44e5d; }.today .date { color:#fff; background:var(--blue); border-radius:50%; }.event { display:block; width:100%; text-align:left; border-radius:6px; padding:5px 6px; margin-top:4px; background:#e3efff; color:#164eab; font-size:11px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.event:hover { background:#cfe3ff; }.empty { text-align:center; padding:36px 15px; color:#8490a2; font-size:14px; }
    dialog { border:0; border-radius:16px; padding:0; width:min(440px,calc(100vw - 34px)); box-shadow:0 20px 70px #142c5480; } dialog::backdrop { background:#10233f88; }.modal-head { padding:22px 24px 16px; display:flex; justify-content:space-between; align-items:center; }.modal-head h3 { margin:0; font-size:19px; }.close { font-size:25px; color:#708096; background:transparent; }.modal-body { padding:4px 24px 24px; }.field { margin:15px 0; }.field label { display:block; margin-bottom:7px; font-weight:700; font-size:13px; }.field input,.field select { width:100%; border:1px solid #cdd8e6; border-radius:8px; padding:11px 12px; font:inherit; color:#1b2940; background:#fff; }.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }.modal-foot { border-top:1px solid var(--line); padding:16px 24px; display:flex; justify-content:flex-end; gap:9px; }.cancel { background:#eef2f7; padding:10px 14px; border-radius:8px; color:#41516a; font-weight:700; }.delete { margin-right:auto; color:var(--danger); background:#fff0f1; padding:10px 13px; border-radius:8px; font-weight:700; }.message { display:none; margin:12px 0 0; padding:10px 11px; border-radius:8px; color:#b52d3d; background:#fff0f1; font-size:13px; }.message.show { display:block; }.header-actions{display:flex;align-items:center;gap:12px}.account{font-size:13px;opacity:.8}.logout{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:8px 10px}.auth-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(135deg,#10233ff5,#1f5babed);padding:20px}.auth-gate[hidden]{display:none}.auth-card{width:min(400px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 70px #0006}.auth-card h2{font-size:23px;margin:0 0 9px}.auth-card p{font-size:14px;color:#69768a;line-height:1.6;margin:0 0 22px}.auth-card .field{margin:12px 0}.auth-card .primary{width:100%;margin-top:8px}.auth-message{min-height:20px;margin-top:14px;color:#bd3041;font-size:13px}.auth-message.ok{color:#167646}
    @media(max-width:800px){ .wrap{grid-template-columns:1fr;margin-top:18px;padding:0 12px}.days{min-height:430px}.day{min-height:82px;padding:5px}.event{font-size:10px}.selected-label{display:none} header{padding:20px}.weekdays div{padding:9px 4px;text-align:center}.month-title{font-size:17px} }
  </style>
</head>
<body>
  <header><div><h1>장비 예약 캘린더</h1><p class="subtitle">장비를 선택하고, 겹치지 않게 예약을 관리하세요.</p></div><div class="header-actions"><span class="account" id="accountName" hidden></span><button class="logout" id="logoutButton" hidden>로그아웃</button><button class="primary" id="newReservation">+ 예약 추가</button></div></header>
  <section class="auth-gate" id="authGate" hidden><form class="auth-card" id="loginForm"><h2>예약 캘린더</h2><p>공용 비밀번호를 입력해 주세요. 같은 브라우저에서는 다음 방문에도 자동으로 열립니다.</p><div class="field"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="비밀번호"></div><button class="primary" type="submit">입장하기</button><div class="auth-message" id="authMessage"></div></form></section>
  <main class="wrap"><aside class="panel"><div class="side-head"><h2>보유 장비</h2><button class="primary" id="newEquipment">+ 장비</button></div><div class="equip-list" id="equipmentList"></div><div class="side-note">장비를 선택하면 해당 장비의 예약만 캘린더에 표시됩니다.<br>✎ 버튼으로 장비 이름을 수정하거나 삭제할 수 있습니다.</div></aside>
  <section class="panel"><div class="calendar-head"><div class="month-nav"><button id="prevMonth" aria-label="이전 달">‹</button><div class="month-title" id="monthTitle"></div><button id="nextMonth" aria-label="다음 달">›</button></div><span class="selected-label" id="selectedLabel"></span></div><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="calendar"></div></section></main>
  <dialog id="reservationModal"><form method="dialog" id="reservationForm"><div class="modal-head"><h3 id="reservationTitle">예약 추가</h3><button type="button" class="close" data-close="reservationModal" aria-label="닫기">×</button></div><div class="modal-body"><div class="field"><label for="reservationEquipment">장비</label><select id="reservationEquipment" required></select></div><div class="row"><div class="field"><label for="reservationDate">날짜</label><input id="reservationDate" type="date" required></div><div class="field"><label for="reservationName">사용자 이름</label><input id="reservationName" maxlength="30" placeholder="이름을 입력하세요" required></div></div><div class="row"><div class="field"><label for="startTime">시작 시간</label><input id="startTime" type="time" required></div><div class="field"><label for="endTime">종료 시간</label><input id="endTime" type="time" required></div></div><div class="message" id="reservationMessage"></div></div><div class="modal-foot"><button type="button" class="delete" id="deleteReservation" hidden>예약 삭제</button><button type="button" class="cancel" data-close="reservationModal">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
  <dialog id="equipmentModal"><form method="dialog" id="equipmentForm"><div class="modal-head"><h3 id="equipmentTitle">장비 추가</h3><button type="button" class="close" data-close="equipmentModal" aria-label="닫기">×</button></div><div class="modal-body"><div class="field"><label for="equipmentName">장비 이름</label><input id="equipmentName" maxlength="30" placeholder="예: 소니 A7 IV" required></div><div class="message" id="equipmentMessage"></div></div><div class="modal-foot"><button type="button" class="delete" id="deleteEquipment" hidden>장비 삭제</button><button type="button" class="cancel" data-close="equipmentModal">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const defaults=[{id:'camera',name:'카메라',icon:'📷'},{id:'projector',name:'빔프로젝터',icon:'📽️'},{id:'laptop',name:'노트북',icon:'💻'}];
    let equipment=JSON.parse(localStorage.getItem('equipment-list')||'null')||defaults, reservations=JSON.parse(localStorage.getItem('equipment-reservations')||'[]'), selected=equipment[0]?.id, view=new Date(); view.setDate(1); let editingReservation=null, editingEquipment=null;
    const cloudConfig=window.SUPABASE_CONFIG||{}, hasCloudConfig=Boolean(cloudConfig.url&&cloudConfig.publishableKey), db=hasCloudConfig&&window.supabase?window.supabase.createClient(cloudConfig.url,cloudConfig.publishableKey):null, cloudEnabled=Boolean(db), sharedPassword='nceluos', accessKey='ncel-equipment-access';let realtimeChannel=null;
    const $=id=>document.getElementById(id), save=()=>{localStorage.setItem('equipment-list',JSON.stringify(equipment));localStorage.setItem('equipment-reservations',JSON.stringify(reservations));};
    const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    function renderEquipment(){ const box=$('equipmentList'); box.innerHTML=equipment.length?'':'<div class="empty">등록된 장비가 없습니다.<br>장비를 추가해 주세요.</div>'; equipment.forEach(e=>{const b=document.createElement('button');b.className='equip '+(e.id===selected?'active':'');b.innerHTML=`<span class="icon">${e.icon||'🔧'}</span><span class="equip-name">${e.name}</span><span class="edit" title="수정">✎</span>`;b.onclick=ev=>{if(ev.target.closest('.edit')) openEquipment(e); else {selected=e.id;render();}};box.append(b)}); }
    function renderCalendar(){ const first=new Date(view), start=new Date(first);start.setDate(1-first.getDay()); const title=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long'}).format(view);$('monthTitle').textContent=title;$('selectedLabel').textContent=equipment.find(e=>e.id===selected)?.name||'장비를 선택하세요'; const cal=$('calendar');cal.innerHTML=''; const today=dateKey(new Date()); for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=dateKey(d), cell=document.createElement('div');cell.className='day '+(d.getMonth()!==view.getMonth()?'other ':'')+(key===today?'today':'');cell.innerHTML=`<span class="date ${d.getDay()===0?'sun':''}">${d.getDate()}</span>`; reservations.filter(r=>r.equipmentId===selected&&r.date===key).sort((a,b)=>a.start.localeCompare(b.start)).forEach(r=>{let ev=document.createElement('button');ev.className='event';ev.textContent=`${r.start}–${r.end} · ${r.name}`;ev.title=ev.textContent;ev.onclick=()=>openReservation(r);cell.append(ev)});cell.ondblclick=()=>openReservation(null,key);cal.append(cell)} }
    function render(){renderEquipment();renderCalendar();}
    function options(){ $('reservationEquipment').innerHTML=equipment.map(e=>`<option value="${e.id}">${e.name}</option>`).join(''); }
    function openReservation(r=null,date=''){ if(!equipment.length){alert('먼저 장비를 추가해 주세요.');return;} editingReservation=r?.id||null;options();$('reservationTitle').textContent=r?'예약 수정':'예약 추가';$('reservationEquipment').value=r?.equipmentId||selected;$('reservationDate').value=r?.date||date||dateKey(new Date());$('reservationName').value=r?.name||'';$('startTime').value=r?.start||'09:00';$('endTime').value=r?.end||'10:00';$('deleteReservation').hidden=!r;$('reservationMessage').classList.remove('show');$('reservationModal').showModal(); }
    function openEquipment(e=null){editingEquipment=e?.id||null;$('equipmentTitle').textContent=e?'장비 수정':'장비 추가';$('equipmentName').value=e?.name||'';$('deleteEquipment').hidden=!e;$('equipmentMessage').classList.remove('show');$('equipmentModal').showModal();}
    async function loadCloud(){if(!cloudEnabled)return;const [eq,res]=await Promise.all([db.from('equipment').select('*').order('created_at'),db.from('reservations').select('*')]);if(eq.error||res.error){console.error(eq.error||res.error);return;}equipment=eq.data.map(e=>({id:e.id,name:e.name,icon:e.icon}));reservations=res.data.map(r=>({id:r.id,equipmentId:r.equipment_id,date:r.reservation_date,name:r.user_name,start:r.start_time.slice(0,5),end:r.end_time.slice(0,5)}));if(!equipment.some(e=>e.id===selected))selected=equipment[0]?.id;render();}
    function showCloudError(message,error){console.error(error);message.textContent=error?.message||'공유 서버와 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';message.classList.add('show');}
    function showLogin(message='',ok=false){$('authGate').hidden=false;$('authMessage').textContent=message;$('authMessage').className='auth-message '+(ok?'ok':'');$('accountName').hidden=true;$('logoutButton').hidden=true;}
    function showApp(){$('authGate').hidden=true;$('accountName').textContent='공용 접속';$('accountName').hidden=false;$('logoutButton').hidden=false;}
    async function startSharedApp(){showApp();if(cloudEnabled){await loadCloud();if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('equipment-reservation-changes').on('postgres_changes',{event:'*',schema:'public',table:'equipment'},loadCloud).on('postgres_changes',{event:'*',schema:'public',table:'reservations'},loadCloud).subscribe();}else render();}
    $('reservationForm').addEventListener('submit',async ev=>{ev.preventDefault();let r={id:editingReservation||crypto.randomUUID(),equipmentId:$('reservationEquipment').value,date:$('reservationDate').value,name:$('reservationName').value.trim(),start:$('startTime').value,end:$('endTime').value}; let msg=$('reservationMessage'); if(r.start>=r.end){msg.textContent='종료 시간은 시작 시간보다 늦어야 합니다.';msg.classList.add('show');return;} let conflict=reservations.some(x=>x.id!==r.id&&x.equipmentId===r.equipmentId&&x.date===r.date&&r.start<x.end&&r.end>x.start);if(conflict){msg.textContent='같은 장비에 겹치는 시간의 예약이 이미 있습니다.';msg.classList.add('show');return;} if(cloudEnabled){const {error}=await db.rpc('save_reservation',{p_id:r.id,p_equipment_id:r.equipmentId,p_date:r.date,p_name:r.name,p_start:r.start,p_end:r.end});if(error){showCloudError(msg,error);return;}await loadCloud();}else{if(editingReservation)reservations=reservations.map(x=>x.id===r.id?r:x);else reservations.push(r);save();}selected=r.equipmentId;$('reservationModal').close();render();});
    $('equipmentForm').addEventListener('submit',async ev=>{ev.preventDefault();let name=$('equipmentName').value.trim(),msg=$('equipmentMessage');if(equipment.some(e=>e.name===name&&e.id!==editingEquipment)){msg.textContent='같은 이름의 장비가 이미 있습니다.';msg.classList.add('show');return;}let item=editingEquipment?{...equipment.find(e=>e.id===editingEquipment),name}:{id:crypto.randomUUID(),name,icon:'🔧'};if(cloudEnabled){const {error}=await db.from('equipment').upsert(item);if(error){showCloudError(msg,error);return;}selected=item.id;await loadCloud();}else{if(editingEquipment)equipment=equipment.map(e=>e.id===editingEquipment?item:e);else{equipment.push(item);selected=item.id;}save();}$('equipmentModal').close();render();});
    $('deleteReservation').onclick=async()=>{if(cloudEnabled){const {error}=await db.from('reservations').delete().eq('id',editingReservation);if(error){alert(error.message);return;}await loadCloud();}else{reservations=reservations.filter(r=>r.id!==editingReservation);save();}$('reservationModal').close();render();};$('deleteEquipment').onclick=async()=>{let e=equipment.find(x=>x.id===editingEquipment);if(confirm(`'${e.name}' 장비와 해당 장비의 모든 예약을 삭제할까요?`)){if(cloudEnabled){const {error}=await db.from('equipment').delete().eq('id',editingEquipment);if(error){alert(error.message);return;}await loadCloud();}else{equipment=equipment.filter(x=>x.id!==editingEquipment);reservations=reservations.filter(r=>r.equipmentId!==editingEquipment);save();}selected=equipment[0]?.id;$('equipmentModal').close();render();}};
    document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());
    $('newEquipment').onclick=()=>openEquipment();$('newReservation').onclick=()=>openReservation();$('prevMonth').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar();};$('nextMonth').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar();};$('loginForm').onsubmit=async ev=>{ev.preventDefault();const message=$('authMessage'),password=$('loginPassword').value;if(password!==sharedPassword){message.textContent='비밀번호가 올바르지 않습니다.';return;}localStorage.setItem(accessKey,'granted');await startSharedApp();};$('logoutButton').onclick=()=>{localStorage.removeItem(accessKey);if(realtimeChannel)db?.removeChannel(realtimeChannel);showLogin();};
    if(localStorage.getItem(accessKey)==='granted')startSharedApp();else showLogin();
  </script>
</body>
</html>
